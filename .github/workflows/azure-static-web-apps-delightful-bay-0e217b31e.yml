name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  # DEPLOY GATE (added 2026-07-13, after sign-in broke in front of the client).
  # Nothing ships unless a human can still sign in. These invariants are not style rules —
  # each one, on its own, was violated by the code that took the app down. The gate is
  # deliberately dependency-free and deterministic: a flaky gate gets bypassed, and a gate
  # that gets bypassed protects nothing. See test/auth_invariants.js for what each one means.
  verify_auth_invariants:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Sign-in + notification-sender invariants (deploy gate)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Assert the sign-in invariants hold
        run: node test/auth_invariants.js

      # 2026-09-06 — notification SENDER invariants. The From address on call-up
      # notifications moved off David's personal mailbox onto the shared
      # atraining@ account. The property this guards is not "the new sender
      # works" but "a deploy alone changes nothing, and a broken sender still
      # delivers the notification". Offline, no network, no credentials.
      - name: Assert the notification-sender invariants hold
        run: node test/notify_sender_test.js

      # 2026-09-06 — WHO gets notified, and how many times. Pat was receiving
      # every new-order mail twice: once directly, once via the YTZ Shift
      # Managers DL he belongs to. The fix is one word in a list, and it
      # regresses the moment somebody re-adds a name "to be sure he gets it" —
      # which is how the duplicate appeared. The routing block is read straight
      # out of index.html and evaluated, so this tests what ships.
      - name: Assert the notification-routing invariants hold
        run: node test/notification_routing_test.js

  build_and_deploy_job:
    needs: verify_auth_invariants # <-- no deploy if sign-in is broken
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_BAY_0E217B31E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "api" # 2026-05-25: server-side function backend
          output_location: "" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_BAY_0E217B31E }}
          action: "close"

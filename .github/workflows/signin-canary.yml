name: Sign-in canary (manual)

# MANUAL ONLY. There is NO schedule. This never runs on its own, never emails you, and never
# costs anything. It is a button you press if you ever want to ask "can a human still sign in?"
# — nothing more. (David 2026-07-13: the app must not depend on anything of his to keep working,
# and a monitor that runs 4x/day to watch things that change 4x/year is just noise.)
#
# THE REAL GUARD IS THE DEPLOY GATE, not this.
# The 2026-07-13 outage shipped in a DEPLOY (commit cdd8696, 2026-06-26). The gate —
# test/auth_invariants.js, wired as `needs:` on the deploy job in
# azure-static-web-apps-delightful-bay-0e217b31e.yml — rejects that exact code, so it would
# have stopped this before it ever reached the client. It runs only when someone changes the
# app, and it is the thing that actually matters.
#
# THIS FILE IS THE OPTIONAL EXTRA: it checks the LIVE site, for the rarer case where something
# outside our control moves (a pinned CDN file changing, the Entra app registration being
# edited, Microsoft enforcing COOP on the login page). Press "Run workflow" to use it.
#
# IT NEVER SIGNS IN. No credentials, no token, no MFA, no sign-in event, nothing that could
# look like a compromised account. It drives a real browser to the edge of the Microsoft login,
# verifies everything on our side of that line, and aborts.
#
# NOTE: no AI, no API key, no Claude, no Godbot — just Node and Playwright on GitHub's free
# runners. If every AI tool on earth disappeared, this and the app would carry on unchanged.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  canary:
    name: Can a human still sign in?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # canary_selftest.js needs the pre-fix commit 949d124

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Playwright is installed OUTSIDE the repo on purpose. A package.json at the repo root
      # would make Azure Static Web Apps' Oryx builder think this is a Node app and try to
      # BUILD it — changing what gets deployed. Do not add one.
      - name: Install Playwright (outside the repo)
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y >/dev/null 2>&1
          npm install playwright@1.49.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Sign-in invariants (live site)
        env:
          NODE_PATH: /tmp/pw/node_modules
        run: node test/canary_live.js

      - name: Self-test — prove the check still catches the 2026-07-13 outage
        env:
          NODE_PATH: /tmp/pw/node_modules
        run: node test/canary_selftest.js
